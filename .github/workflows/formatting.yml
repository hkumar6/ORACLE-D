name: Python Formatting Test

on:
  push:
    branches:
      - 'refactor/**'
      - 'temp/**'

jobs:
  black-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Black
        run: |
          python -m pip install --upgrade pip
          pip install black "isort[colors]"

      - name: Check Formatting
        run: black --check --diff --color .
      
      - name: Check imports
        run: isort --check-only --diff --color .