name: Python Formatting Test

on:
  push:
    branches:
      - 'refactor/**'
      - 'temp/**'

jobs:
    ruff-check:
      runs-on: ubuntu-latest
      steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"
            cache: 'pip'

      - name: Ruff
        uses: astral-sh/ruff-action@v4.1.0

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Check
        uses: astral-sh/ruff-action@v4.1.0
